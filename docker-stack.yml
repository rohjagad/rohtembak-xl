services:
  rohtembak-xl:
    # PRODUCTION (branch main). Repo private: pada deploy fresh, buat repo
    # public sementara agar clone / curl raw.githubusercontent berhasil,
    # lalu kembalikan ke private setelah stack jalan. Untuk update saat repo
    # sudah private, set remote ber-token SEKALI di dalam container:
    #   docker exec <container> bash -c     #     "cd /opt/rohtembak && git remote set-url origin https://<PAT>@github.com/rohjagad/rohtembak-xl"
    # setelah itu `git pull --ff-only` tetap jalan tanpa repo public.
    #
    # TIDAK AUTO-UPDATE: app hanya di-clone sekali; perubahan di GitHub tidak
    # masuk otomatis. Update manual:
    #   docker exec <container> bash -c "cd /opt/rohtembak && git pull --ff-only"
    #   docker service update --force rohtembak-xl
    image: debian:12
    environment:
      APP_PORT: 8000
      INSTALL_DIR: /opt/rohtembak
    volumes:
      - rohtembak_data:/opt/rohtembak
    networks:
      - common-overlay
    entrypoint: ["/bin/bash", "-c", "set -e; if ! command -v curl >/dev/null 2>&1; then export DEBIAN_FRONTEND=noninteractive; apt-get update -y >/dev/null; apt-get install -y curl >/dev/null; fi; if [ -f /opt/rohtembak/entrypoint.sh ]; then cp /opt/rohtembak/entrypoint.sh /usr/local/bin/entrypoint.sh; else curl -fsSL https://raw.githubusercontent.com/rohjagad/rohtembak-xl/main/entrypoint.sh -o /usr/local/bin/entrypoint.sh; fi; chmod +x /usr/local/bin/entrypoint.sh; exec /usr/local/bin/entrypoint.sh"]
    deploy:
      replicas: 1
      placement:
        constraints:
          # Volume rohtembak_data bersifat LOKAL per-node — constraint ini
          # menjaga service & datanya selalu di satu node yang sama.
          - node.hostname == stb3
      restart_policy:
        condition: any
        delay: 5s

networks:
  common-overlay:
    external: true

volumes:
  rohtembak_data:
