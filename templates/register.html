<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - RohTembak (XL)</title>
    <link rel="stylesheet" href="/static/css/style.css?v=26">
    <style>
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 42px; }
    .pw-toggle {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: #9ca3af;
      padding: 4px; display: inline-flex; align-items: center; justify-content: center;
    }
    .pw-toggle:hover { color: #374151; }
    .pw-toggle svg { width: 18px; height: 18px; }
    </style>
</head>
<body class="login-page">
<div class="login-card">
    <h1>Daftar Akun</h1>
    <p class="subtitle">Buat akun pengguna baru</p>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/register">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" placeholder="Pilih username"
                   pattern="[A-Za-z0-9]+" title="Hanya huruf dan angka (tanpa spasi/simbol)"
                   oninput="this.value = this.value.replace(/[^A-Za-z0-9]/g, '')"
                   required>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="contoh@email.com" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <div class="pw-wrap">
                <input type="password" name="password" placeholder="Buat password" required>
                <button type="button" class="pw-toggle" onclick="togglePw(this)" aria-label="Tampilkan password" tabindex="-1">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
            </div>
            <div style="font-size:12px;color:#b45309;margin-top:4px;line-height:1.4;">
                &#9888; Gunakan password acak, bukan password utama kamu.
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Daftar</button>
    </form>

    <p style="text-align:center;margin-top:16px;font-size:13px;color:#999;">
        Sudah punya akun? <a href="/login">Masuk</a>
    </p>
</div>
<script>
function togglePw(btn) {
    var input = btn.closest('.pw-wrap').querySelector('input');
    if (!input) return;
    var show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    btn.innerHTML = show
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
}
</script>
</body>
</html>
