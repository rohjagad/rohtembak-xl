{% for xl in xl_accounts %}
<div class="xl-item {{ 'active' if xl.is_active }}">
    <div class="xl-head">
        <div class="info">
            <div>
                <div class="number">{{ xl.phone_number }}</div>
                {% if xl.label %}
                <div style="font-size:12px;color:#666;">{{ xl.label }}</div>
                {% endif %}
            </div>
        </div>
        <span class="xl-caret">&#9662;</span>
    </div>
    <div class="actions">
        {% if not xl.is_active %}
        <form method="POST" action="/user/xl/set-active" style="display:inline">
            <input type="hidden" name="xl_id" value="{{ xl.id }}">
            <button class="btn btn-sm btn-outline">Aktifkan</button>
        </form>
        {% endif %}
        <form method="POST" action="/user/xl/remove" style="display:inline" onsubmit='return confirm("Hapus nomor " + {{ xl.phone_number | tojson }} + "?")'>
            <input type="hidden" name="xl_id" value="{{ xl.id }}">
            <button class="btn btn-sm btn-danger">Hapus</button>
        </form>
    </div>
</div>
{% endfor %}
