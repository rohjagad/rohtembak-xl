services:
  rohtembak:
    # TIDAK AUTO-UPDATE: entrypoint hanya clone sekali; perubahan di GitHub
    # tidak masuk otomatis. Update manual:
    #   docker exec rohtembak bash -c "cd /opt/rohtembak && git pull --ff-only"
    #   docker restart rohtembak
    image: debian:12
    container_name: rohtembak
    hostname: rohtembak
    ports:
      - "8000:8000"
    environment:
      APP_PORT: 8000
      INSTALL_DIR: /opt/rohtembak
    volumes:
      - rohtembak_data:/opt/rohtembak
      - ./entrypoint.sh:/usr/local/bin/entrypoint.sh:ro,Z
    restart: unless-stopped
    stop_grace_period: 30s
    entrypoint: ["/bin/bash", "/usr/local/bin/entrypoint.sh"]

volumes:
  rohtembak_data:
