services:
  rohtembak-xl-v1:
    image: debian:12
    container_name: rohtembak-xl-v1
    hostname: rohtembak-xl-v1
    ports:
      - "8600:8000"
    environment:
      APP_PORT: 8000
      INSTALL_DIR: /opt/rohtembak-xl
    volumes:
      # Install (code + venv + .env) disimpan di ./install pada host.
      - ./install:/opt/rohtembak-xl
      # Data runtime (SQLite DB + fingerprint) disimpan di ./data pada host.
      - ./data:/opt/rohtembak-xl/data
    restart: unless-stopped
    stop_grace_period: 30s
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        BOOTSTRAP="/opt/rohtembak-xl/entrypoint.sh"
        if [ ! -s "$$BOOTSTRAP" ]; then
          if ! command -v curl >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            if ! apt-get update -y >/dev/null || ! apt-get install -y curl ca-certificates >/dev/null; then
              echo "[bootstrap] Gagal install curl. Cek DNS/koneksi ke deb.debian.org."
              sleep infinity
            fi
          fi
          echo "[bootstrap] Downloading entrypoint.sh..."
          if ! curl -fsSL https://raw.githubusercontent.com/rohjagad/rohtembak-xl/main/entrypoint.sh -o "$$BOOTSTRAP"; then
            echo "[bootstrap] Gagal download entrypoint.sh. Cek DNS/koneksi ke github.com."
            sleep infinity
          fi
        fi
        exec /bin/bash "$$BOOTSTRAP"
